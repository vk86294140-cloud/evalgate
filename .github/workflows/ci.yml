name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy evalgate
      - run: pytest -q --cov=evalgate --cov-report=term-missing --cov-fail-under=85

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: the example suite must pass its own gate
        run: evalgate run -c examples/support_bot/evalgate.yaml --markdown eval.md --junit eval.xml
      - name: the gate must fail when the bot gets sloppy
        run: |
          if SUPPORT_BOT_SLOPPY=1 evalgate run -c examples/support_bot/evalgate.yaml; then
            echo "the gate passed a run it should have blocked"
            exit 1
          fi
      - if: always()
        run: cat eval.md >> "$GITHUB_STEP_SUMMARY"
